<!doctype html>
<meta charset="utf-8">
<title>Open Computer Use — history access</title>
<h1>Browser history access</h1>
<p>Enable this optional permission when you want Open Computer Use to answer a history request. The history interface queries URLs, titles and visit dates. The extension does not store history query results.</p>
<p id="status" role="status">Checking permission…</p>
<button id="enable" disabled>Enable history access</button>
<button id="disable" disabled>Remove history access</button>
<script src="options.js" type="module"></script>
